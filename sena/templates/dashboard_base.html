<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>{% block title %}TecnoCorte{% endblock %}</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" crossorigin href="https://fonts.gstatic.com"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          outline: "#99907c",
          surface: "#131313",
          background: "#131313",
          on_background: "#e2e2e2",
          surface_container: "#1f1f1f",
          surface_container_high: "#2a2a2a",
          surface_container_highest: "#353535",
          surface_container_low: "#1b1b1b",
          surface_container_lowest: "#0e0e0e",
          surface_variant: "#353535",
          on_surface: "#e2e2e2",
          on_surface_variant: "#d0c5af",
          primary: "#f2ca50",
          primary_container: "#d4af37",
          on_primary: "#3c2f00",
          on_primary_container: "#554300",
          secondary: "#eac249",
          secondary_container: "#b08c10",
          on_secondary: "#3d2f00",
          on_secondary_container: "#352800",
          tertiary: "#bfcdff",
          tertiary_container: "#97b0ff",
          on_tertiary: "#082b72",
          on_tertiary_container: "#254188",
          error: "#ffb4ab",
          error_container: "#93000a"
        },
        borderRadius: {
          DEFAULT: "0.125rem",
          lg: "0.25rem",
          xl: "0.5rem",
          full: "0.75rem"
        },
        fontFamily: {
          headline: ["Noto Serif"],
          display: ["Noto Serif"],
          body: ["Manrope"],
          label: ["Manrope"]
        }
      }
    }
  }
</script>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background-color: #131313; color: #e2e2e2; font-family: 'Manrope', sans-serif; }
  h1, h2, h3, h4, h5, h6, .font-headline { font-family: 'Noto Serif', serif; }
  .glass-nav, .glass-header { backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); background-color: rgba(19, 19, 19, 0.7); }
  .gold-gradient-bg { background: linear-gradient(135deg, #f2ca50 0%, #d4af37 100%); }
  .ambient-shadow { box-shadow: 0 40px 40px -15px rgba(242, 202, 80, 0.06); }
  .ghost-border { border: 1px solid rgba(77, 70, 53, 0.15); }
  .signature-divider { height: 48px; display: flex; align-items: center; justify-content: center; }
  .signature-divider::after { content: ''; width: 4px; height: 4px; background-color: #d4af37; border-radius: 50%; }
  .btn-gold-gradient { background: linear-gradient(135deg, #f2ca50 0%, #d4af37 100%); color: #241a00; }
  .btn-gold-gradient:hover { opacity: 0.9; }
  .input-underline { background: transparent; border: none; border-bottom: 1px solid rgba(255,255,255,0.15); }
  .input-underline:focus { outline: none; border-bottom-color: #f2ca50; }
  .scrollbar-hide::-webkit-scrollbar { display: none; }
  .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
</style>
{% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}font-body antialiased flex bg-background text-on-surface{% endblock %}">
{% block content %}{% endblock %}
</body>
</html>
