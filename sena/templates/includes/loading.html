{% load static %}
<!-- Sistema de carga: overlay global que se activa automáticamente al enviar formularios -->
<div id="tc-loading" class="tc-loading-overlay" aria-hidden="true" role="status">
  <div class="tc-loading-card">
    <div class="tc-loading-spinner"></div>
    <p class="tc-loading-text">Cargando...</p>
  </div>
</div>
<link rel="stylesheet" href="{% static 'css/includes/loading.css' %}" />
<script>
(function () {
  var overlay = document.getElementById("tc-loading");
  if (!overlay) return;
  var hideTimer = null;
  var activeButton = null;

  function restoreButton() {
    if (!activeButton) return;
    activeButton.disabled = false;
    if (activeButton.dataset.loadingBackup !== undefined) {
      activeButton.innerHTML = activeButton.dataset.loadingBackup;
      delete activeButton.dataset.loadingBackup;
    }
    activeButton.removeAttribute("aria-busy");
    activeButton = null;
  }

  function showLoading(msg) {
    var text = overlay.querySelector(".tc-loading-text");
    if (text && msg) text.textContent = msg;
    overlay.classList.add("is-active");
    overlay.setAttribute("aria-hidden", "false");
    document.body.style.pointerEvents = "none";
    clearTimeout(hideTimer);
    hideTimer = setTimeout(hideLoading, 15000);
  }

  function hideLoading() {
    restoreButton();
    overlay.classList.remove("is-active");
    overlay.setAttribute("aria-hidden", "true");
    document.body.style.pointerEvents = "";
    clearTimeout(hideTimer);
  }

  document.addEventListener("submit", function (e) {
    var form = e.target;
    // Los formularios AJAX gestionan su propio estado de carga y notifican
    // el resultado; no deben dejar bloqueado el overlay global.
    if (form.hasAttribute("data-sin-cargando")) return;
    // La reserva tiene validación propia: solo muestra carga si todos sus
    // campos ocultos están completos; así un formulario inválido no se queda
    // bloqueado mostrando "Procesando...".
    if (form.id === "form-reserva") {
      var reservaIncompleta = Array.from(form.querySelectorAll("input[type=hidden][name]:not([name=csrfmiddlewaretoken])")).some(function (input) {
        return !input.value;
      });
      if (reservaIncompleta) return;
    }
    if (form.method && form.method.toUpperCase() === "GET") return;
    var btn = form.querySelector("[type=submit], button:not([type=button])");
    var label = btn ? (btn.textContent || "Cargando...").trim() : "Cargando...";
    showLoading(label);
    if (btn) {
      restoreButton();
      btn.disabled = true;
      btn.dataset.loadingBackup = btn.innerHTML;
      btn.setAttribute("aria-busy", "true");
      activeButton = btn;
      btn.innerHTML = '<span class="material-symbols-outlined" style="animation:tc-spin .7s linear infinite;font-size:1.1rem">progress_activity</span> Procesando...';
    }
  }, true);

  document.addEventListener("click", function (e) {
    var link = e.target.closest("a[href]");
    if (!link) return;
    var href = link.getAttribute("href");
    if (!href || href === "#" || href.startsWith("javascript:") || href.startsWith("mailto:") || href.startsWith("tel:")) return;
    if (link.target === "_blank" || link.hasAttribute("data-no-loading")) return;
    if (link.closest(".tc-loading-overlay") || link.closest("[data-confirm]")) return;
    if (link.closest("form")) return;
    var label = (link.textContent || "Cargando...").trim();
    showLoading(label.length > 30 ? "Cargando..." : label);
  }, true);

  window.tcShowLoading = showLoading;
  window.tcHideLoading = hideLoading;
  window.tcRestoreLoadingButton = restoreButton;
})();
</script>
