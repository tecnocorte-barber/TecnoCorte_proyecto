<div class="tc-password-meter" data-password-meter aria-live="polite">
  <div class="tc-password-meter__head">
    <span>Seguridad de la contraseña</span>
    <strong data-password-label>Sin evaluar</strong>
  </div>
  <div class="tc-password-meter__track" role="progressbar" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0">
    <span data-password-bar></span>
  </div>
  <ul class="tc-password-meter__rules">
    <li data-rule="length">8 caracteres o más</li>
    <li data-rule="upper">Una letra mayúscula</li>
    <li data-rule="number">Un número</li>
    <li data-rule="symbol">Un símbolo</li>
  </ul>
</div>
<style>
  .tc-password-meter { margin-top:.55rem; font-size:.72rem; color:var(--c-on-surface-variant); }
  .tc-password-meter__head { display:flex; justify-content:space-between; gap:.75rem; margin-bottom:.35rem; }
  .tc-password-meter__head strong { color:var(--c-on-surface); }
  .tc-password-meter__track { height:.35rem; overflow:hidden; border-radius:999px; background:var(--c-surface-container-highest); }
  .tc-password-meter__track span { display:block; height:100%; width:0; border-radius:inherit; background:var(--c-error); transition:width .2s ease, background-color .2s ease; }
  .tc-password-meter__rules { display:flex; flex-wrap:wrap; gap:.25rem .75rem; margin:.45rem 0 0; padding:0; list-style:none; }
  .tc-password-meter__rules li::before { content:'○'; margin-right:.25rem; color:var(--c-on-surface-variant); }
  .tc-password-meter__rules li.is-valid { color:var(--c-primary); }
  .tc-password-meter__rules li.is-valid::before { content:'✓'; color:var(--c-primary); }
</style>
<script>
(function () {
  function evaluar(input) {
    var meter = input.parentElement.querySelector('[data-password-meter]') ||
      input.parentElement.nextElementSibling?.querySelector('[data-password-meter]') ||
      input.parentElement.parentElement?.querySelector('[data-password-meter]');
    if (!meter) return;
    var value = input.value || '';
    var checks = {
      length: value.length >= 8,
      upper: /[A-Z]/.test(value),
      number: /[0-9]/.test(value),
      symbol: /[^A-Za-z0-9]/.test(value)
    };
    var score = Object.keys(checks).filter(function (key) { return checks[key]; }).length;
    if (value.length >= 12 && score === 4) score = 5;
    var labels = ['Muy débil', 'Muy débil', 'Débil', 'Media', 'Fuerte', 'Muy fuerte'];
    var colors = ['var(--c-error)', 'var(--c-error)', '#f59e0b', '#eab308', 'var(--c-primary)', 'var(--c-primary)'];
    var label = meter.querySelector('[data-password-label]');
    var bar = meter.querySelector('[data-password-bar]');
    var progress = meter.querySelector('[role="progressbar"]');
    label.textContent = value ? labels[score] : 'Sin evaluar';
    bar.style.width = (score * 20) + '%';
    bar.style.backgroundColor = value ? colors[score] : 'var(--c-surface-container-highest)';
    progress.setAttribute('aria-valuenow', score);
    Object.keys(checks).forEach(function (key) {
      var rule = meter.querySelector('[data-rule="' + key + '"]');
      if (rule) rule.classList.toggle('is-valid', checks[key]);
    });
  }
  function iniciar() {
    document.querySelectorAll('[data-password-strength]').forEach(function (input) {
      if (input.dataset.passwordBound === 'true') return;
      input.dataset.passwordBound = 'true';
      input.addEventListener('input', function () { evaluar(input); });
      evaluar(input);
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar);
  else iniciar();
})();
</script>
