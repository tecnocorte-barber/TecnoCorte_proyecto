<style>
  .tc-inline-spinner {
    display: inline-block;
    width: .9rem;
    height: .9rem;
    margin-right: .35rem;
    border: 2px solid currentColor;
    border-right-color: transparent;
    border-radius: 50%;
    vertical-align: -.12rem;
    animation: tc-inline-spin .7s linear infinite;
  }
  @keyframes tc-inline-spin { to { transform: rotate(360deg); } }
</style>
<script>
(function () {
  if (window.TecnoCorteCargando) return;
  window.TecnoCorteCargando = true;
  var ICONO = '<span class="tc-inline-spinner" aria-hidden="true"></span>';
  var TEXTO = 'Procesando, por favor espera...';
  var REINTENTAR_EN_MS = 15000;
  var EXCLUIDOS = ['sin-cargando'];

  function botonDeFormulario(form, submitter) {
    if (submitter && submitter.matches && submitter.matches('button[type="submit"], input[type="submit"]')) return submitter;
    return form.querySelector('button[type="submit"], input[type="submit"]');
  }

  function sePuedeBloquear(boton) {
    if (!boton || boton.disabled) return false;
    if (EXCLUIDOS.some(function (clase) { return boton.classList.contains(clase); })) return false;
    return true;
  }

  function bloquear(boton) {
    if (!sePuedeBloquear(boton) || boton.dataset.cargando === 'true') return false;
    if (boton.name && boton.form) {
      var ocultos = boton.form.querySelectorAll('input[type="hidden"][name]');
      var campoExistente = null;
      for (var i = 0; i < ocultos.length; i++) {
        if (ocultos[i].name === boton.name) {
          campoExistente = ocultos[i];
          break;
        }
      }
      if (campoExistente) {
        campoExistente.value = boton.value;
      } else {
        var campoSubmitter = document.createElement('input');
        campoSubmitter.type = 'hidden';
        campoSubmitter.name = boton.name;
        campoSubmitter.value = boton.value;
        boton.form.appendChild(campoSubmitter);
        boton._tcCampoSubmitter = campoSubmitter;
      }
    }
    var contenedor = boton.tagName === 'INPUT' ? boton.parentNode : boton;
    if (contenedor) contenedor.style.pointerEvents = 'none';
    boton.dataset.textoOriginal = boton.innerHTML;
    boton.dataset.cargando = 'true';
    boton.setAttribute('aria-busy', 'true');
    boton.innerHTML = ICONO + TEXTO;
    boton.disabled = true;
    window.setTimeout(function () {
      if (boton.dataset.cargando === 'true') restaurar(boton);
    }, REINTENTAR_EN_MS);
    return true;
  }

  function restaurar(boton) {
    boton.dataset.cargando = 'false';
    boton.removeAttribute('aria-busy');
    boton.disabled = false;
    if (boton._tcCampoSubmitter) {
      boton._tcCampoSubmitter.remove();
      delete boton._tcCampoSubmitter;
    }
    if (boton.dataset.textoOriginal) boton.innerHTML = boton.dataset.textoOriginal;
    if (boton.tagName === 'BUTTON' && boton.parentNode && boton.parentNode.style.pointerEvents === 'none') {
      boton.parentNode.style.pointerEvents = '';
    }
  }

  document.addEventListener('click', function (evento) {
    var submitter = evento.target.closest('button[type="submit"], input[type="submit"]');
    if (submitter && submitter.form) submitter.form._tcSubmitter = submitter;
  }, true);

  document.addEventListener('submit', function (evento) {
    if (evento.defaultPrevented) return;
    if (evento.target.matches('form[data-sin-cargando]')) return;
    // Cuando existe el overlay global, ese sistema controla el botón y el
    // estado de carga. Evita que ambos scripts compitan por el mismo formulario.
    if (document.getElementById('tc-loading')) return;
    var boton = botonDeFormulario(evento.target, evento.submitter || evento.target._tcSubmitter);
    if (!boton) return;
    if (boton.dataset.cargando === 'true' || boton.disabled) {
      evento.preventDefault();
      return;
    }
    bloquear(boton);
  });
})();
</script>
