<script>
  (function() {
    var t = 'dark';
    try {
      t = localStorage.getItem('tc-theme') || 'dark';
    } catch (error) {
      // La interfaz sigue funcionando si el navegador bloquea el almacenamiento.
    }
    if (t !== 'light' && t !== 'dark') t = 'dark';
    document.documentElement.classList.toggle('dark', t === 'dark');
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>

<script>
  function setTheme(theme) {
    var html = document.documentElement;
    var next = theme === 'light' ? 'light' : 'dark';
    html.classList.toggle('dark', next === 'dark');
    html.setAttribute('data-theme', next);
    try {
      localStorage.setItem('tc-theme', next);
    } catch (error) {
      // El cambio visual no depende de poder persistir la preferencia.
    }
    document.querySelectorAll('.theme-icon').forEach(function(el) {
      el.textContent = next === 'dark' ? 'dark_mode' : 'light_mode';
    });
    document.querySelectorAll('[data-theme-toggle]').forEach(function(button) {
      button.setAttribute('aria-label', next === 'dark' ? 'Activar tema claro' : 'Activar tema oscuro');
      button.setAttribute('title', next === 'dark' ? 'Activar tema claro' : 'Activar tema oscuro');
      button.setAttribute('aria-pressed', next === 'dark' ? 'true' : 'false');
    });
  }

  function toggleTheme() {
    setTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark');
  }

  document.addEventListener('DOMContentLoaded', function() {
    var current = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
    setTheme(current);

    document.querySelectorAll('[data-pill-nav]').forEach(function(nav) {
      var highlight = nav.querySelector('.pill-nav-highlight');
      var links = Array.prototype.slice.call(nav.querySelectorAll('[data-pill-link]'));
      var active = nav.querySelector('[data-pill-link].is-active');
      if (!highlight || !links.length) return;

      function moveHighlight(link) {
        highlight.style.left = link.offsetLeft + 'px';
        highlight.style.width = link.offsetWidth + 'px';
        highlight.style.opacity = '1';
      }

      if (active) moveHighlight(active);
      links.forEach(function(link) {
        link.addEventListener('mouseenter', function() { moveHighlight(link); });
      });
      if (active) {
        nav.addEventListener('mouseleave', function() { moveHighlight(active); });
        window.addEventListener('resize', function() { moveHighlight(active); });
      }
    });
  });
</script>
