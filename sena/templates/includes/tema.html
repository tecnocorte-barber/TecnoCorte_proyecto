<!-- Sistema de temas: detecta preferencia guardada, aplica variables CSS y configuración de Tailwind -->
<script>
  (function () {
    var t = "dark";
    try {
      t = localStorage.getItem("tc-theme") || "dark";
    } catch (error) {
      // La interfaz sigue funcionando si el navegador bloquea el almacenamiento.
    }
    if (t !== "light" && t !== "dark") t = "dark";
    document.documentElement.classList.toggle("dark", t === "dark");
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>

{# Capa de diseño premium (dark elegante + dorado): se carga en todas las páginas #}
<link rel="stylesheet" href="{% static 'css/base/premium.css' %}" />

<script>
  {# Script inline para tema oscuro/claro y animación del pill-nav #}
  function setTheme(theme) {
    var html = document.documentElement;
    var next = theme === "light" ? "light" : "dark";
    html.classList.toggle("dark", next === "dark");
    html.setAttribute("data-theme", next);
    try {
      localStorage.setItem("tc-theme", next);
    } catch (error) {
      // El cambio visual no depende de poder persistir la preferencia.
    }
    document.querySelectorAll(".theme-icon").forEach(function (el) {
      el.textContent = next === "dark" ? "dark_mode" : "light_mode";
    });
    document.querySelectorAll("[data-theme-toggle]").forEach(function (button) {
      button.setAttribute(
        "aria-label",
        next === "dark" ? "Activar tema claro" : "Activar tema oscuro",
      );
      button.setAttribute(
        "title",
        next === "dark" ? "Activar tema claro" : "Activar tema oscuro",
      );
      button.setAttribute("aria-pressed", next === "dark" ? "true" : "false");
    });
  }

  {# Alterna entre tema oscuro y claro #}
  function toggleTheme() {
    setTheme(
      document.documentElement.classList.contains("dark") ? "light" : "dark",
    );
  }

  {# Inicializa tema y anima el highlight del pill-nav en hover #}
  document.addEventListener("DOMContentLoaded", function () {
    var current = document.documentElement.classList.contains("dark")
      ? "dark"
      : "light";
    setTheme(current);

    document.querySelectorAll("[data-pill-nav]").forEach(function (nav) {
      var highlight = nav.querySelector(".pill-nav-highlight");
      var links = Array.prototype.slice.call(
        nav.querySelectorAll("[data-pill-link]"),
      );
      var active = nav.querySelector("[data-pill-link].is-active");
      if (!highlight || !links.length) return;

      function moveHighlight(link) {
        highlight.style.left = link.offsetLeft + "px";
        highlight.style.width = link.offsetWidth + "px";
        highlight.style.opacity = "1";
      }

      if (active) moveHighlight(active);
      links.forEach(function (link) {
        link.addEventListener("mouseenter", function () {
          moveHighlight(link);
        });
      });
      if (active) {
        nav.addEventListener("mouseleave", function () {
          moveHighlight(active);
        });
      } else {
        // En páginas sin una sección activa, el resaltado solo debe aparecer
        // mientras el usuario pasa el cursor por una opción.
        nav.addEventListener("mouseleave", function () {
          highlight.style.opacity = "0";
          highlight.style.width = "0";
        });
      }

      function sincronizarMenuAlCambiarVentana() {
        // Al volver de una ventana minimizada se fuerza el estado de escritorio
        // y se elimina un menú móvil que pudiera haber quedado abierto.
        if (window.innerWidth > 640) {
          nav.classList.remove("is-open");
          var boton = nav.closest(".site-header")?.querySelector(".pill-menu-toggle");
          if (boton) {
            boton.setAttribute("aria-expanded", "false");
            boton.setAttribute("aria-label", "Abrir menú");
            var icono = boton.querySelector(".material-symbols-outlined");
            if (icono) icono.textContent = "menu";
          }
        }
        if (active) window.requestAnimationFrame(function () { moveHighlight(active); });
      }

      window.addEventListener("resize", sincronizarMenuAlCambiarVentana);
      window.addEventListener("pageshow", sincronizarMenuAlCambiarVentana);
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) sincronizarMenuAlCambiarVentana();
      });
    });
  });
</script>
