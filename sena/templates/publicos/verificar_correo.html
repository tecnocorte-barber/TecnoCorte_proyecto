<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Verificar correo - TecnoCorte</title></head>
<body style="font-family:Arial,sans-serif;max-width:460px;margin:60px auto;padding:24px;background:#111;color:#eee">
  <h1>Verifica tu correo</h1>
  <p>Enviamos un código de 6 dígitos a <strong>{{ usuario.email }}</strong>.</p>
  {% if error %}<p style="color:#f88">{{ error }}</p>{% endif %}
  {% if enviado %}<p style="color:#8f8">Se envió un nuevo código.</p>{% endif %}
  <form method="post">{% csrf_token %}<input name="codigo" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="000000"><button type="submit">Verificar</button></form>
  <p><a href="{% url 'sena:reenviar_verificacion' usuario.id %}">Reenviar código</a></p>
</body></html>
